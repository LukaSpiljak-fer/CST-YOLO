   [-1, 1, Conv, [256, 1, 1]],  # 54 CBS
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  # 55 Upsample (2x)
   [38, 1, Conv, [256, 1, 1]],  # 56 CBS
   [[-1, -2], 1, Concat, [1]],  # 57

