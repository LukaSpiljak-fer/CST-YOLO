   [-1, 1, Conv, [128, 3, 2]],  # 74
   [63, 1, Conv, [128, 3, 2]],  # 75 (downsample from layer 63)
   [[-1, -2], 1, Concat, [1]],  # 76

   [-1, 1, Conv, [256, 1, 1]],  # 77
   [-2, 1, Conv, [256, 1, 1]],  # 78
   [-1, 1, Conv, [128, 3, 1]],  # 79
   [-1, 1, Conv, [128, 3, 1]],  # 80
   [[-1, -2, -3, -4], 1, MyConcat4, [1]],  # 81
   [-1, 1, Conv, [256, 1, 1]],  # 82

   # Further downsample
   [-1, 1, Conv, [256, 3, 2]],  # 83
   [53, 1, Conv, [256, 3, 2]],  # 84 (downsample from layer 53)
   [[-1, -2], 1, Concat, [1]],  # 85

