   [-1, 1, Conv, [512, 1, 1]],  # 40
   [-3, 1, Conv, [512, 1, 1]],  # 41
   [-1, 1, Conv, [512, 3, 2]],  # 42
   [[-1, -3], 1, Concat, [1]],  # 43-P5/32

   [-1, 1, Conv, [256, 1, 1]],  # 44 W-ELAN 1
   [-2, 1, Conv, [256, 1, 1]],  # 45
   [-1, 1, Conv, [256, 3, 1]],  # 46
