   [-2, 1, Conv, [512, 1, 1]],  # 87
   [-1, 1, Conv, [256, 3, 1]],  # 88
   [-1, 1, Conv, [256, 3, 1]],  # 89
   [[-1, -2, -3, -4], 1, MyConcat4, [1]],  # 90
   [-1, 1, Conv, [512, 1, 1]],  # 91

   # Detection heads
   [73, 1, RepConv, [256, 3, 1]],  # 92 (P3)
   [82, 1, RepConv, [512, 3, 1]],  # 93 (P4)
   [91, 1, RepConv, [1024, 3, 1]],  # 94 (P5)

   [[92, 93, 94], 1, IDetect, [nc, anchors]],  # 95 Detect(P3, P4, P5)
  ]