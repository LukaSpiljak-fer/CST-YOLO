   [-1, 1, Conv, [64, 3, 1]],  # 7
   [-1, 1, Conv, [64, 3, 1]],  # 8
   [-1, 1, Conv, [64, 3, 1]],  # 9
   [[-1, -3, -5, -6], 1, MyConcat4, [1]],  # 10
   [-1, 1, Conv, [256, 1, 1]],  # 11

