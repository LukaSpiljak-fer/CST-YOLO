   [-1, 1, Conv, [512, 1, 1]],  # 24

   [-1, 1, Conv, [256, 3, 2]],  # 25 CBSConcat (MP->Conv)
   [-1, 1, Conv, [256, 1, 1]],  # 26
   [-3, 1, Conv, [256, 1, 1]],  # 27
   [-1, 1, Conv, [256, 3, 2]],  # 28
